<svg xmlns="http://www.w3.org/2000/svg" width="960" height="204" viewBox="0 0 960 204" role="img" aria-labelledby="title desc">
<title id="title">RouteX</title><desc id="desc">A systems-level intercepting proxy in C that routes TCP connections through Tor without app support.</desc>
<style><![CDATA[@font-face{font-family:'TASA';font-weight:100 900;font-style:normal;src:url('data:font/woff;base64,') format('woff')}
@font-face{font-family:'Oxygen';font-weight:400;font-style:normal;src:url('data:font/woff;base64,') format('woff')}
svg{--bg:#fefcf8;--fg:#1c1917;--muted:#57534e;--subtle:#79716b;--accent:#89937a;
    --border:#e7e5e4;--surface:#f5f5f4;--heat0:#eeece7;--heat1:#dde1d5;
    --heat2:#b7bfa8;--heat3:#89937a;--heat4:#5d674f;color:var(--fg)}
@media(prefers-color-scheme:dark){svg{--bg:#1c1917;--fg:#ededed;--muted:#a8a29e;
